<div class="fixed inset-0 z-20 flex items-center justify-center bg-slate-900/40 p-4" role="presentation">

    <button type="button" aria-label="Chiudi profilo" (click)="onClose()"
        class="absolute inset-0 cursor-default"></button>

    <section role="dialog" aria-modal="true" aria-labelledby="profile-menu-title"
        class="relative z-10 max-h-[calc(100dvh-2rem)] w-full max-w-2xl overflow-y-auto rounded-xl bg-white p-6 shadow-xl">
        <div class="flex items-center justify-between gap-4 border-b border-slate-100 pb-3">
            <h2 id="profile-menu-title" class="text-lg font-semibold text-slate-800">Profilo</h2>
            <button type="button" (click)="onClose()" aria-label="Chiudi profilo"
                class="rounded px-2 py-1 text-xl text-slate-500 hover:bg-slate-100">&times;</button>
        </div>

        <div class="relative mt-4 min-h-80">
            <!-- La navigazione resta laterale da 640px in su, sotto questa soglia lascia spazio ai riepiloghi e diventa un drawer. -->
            <main class="min-w-0 sm:ml-56">
                <div class="mb-4 sm:hidden">
                    <button type="button" (click)="toggleNavigation()" [attr.aria-expanded]="isNavigationOpen()"
                        aria-controls="profile-navigation"
                        class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm">
                        <svg aria-hidden="true" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        Sezioni profilo
                    </button>
                </div>

                <div id="profile-navigation"
                    [class.hidden]="!isNavigationOpen()"
                    class="absolute inset-0 z-20 sm:static sm:z-auto sm:block">
                    <div class="absolute inset-0 sm:hidden">
                    <button type="button" aria-label="Chiudi navigazione profilo"
                        (click)="toggleNavigation()"
                        class="absolute inset-0 size-full bg-white"></button>
                    </div>
                    <nav aria-label="Sezioni profilo"
                        class="absolute inset-y-0 left-0 flex w-56 max-w-[85%] flex-col gap-1 rounded-xl bg-slate-100 p-2  sm:left-0 sm:top-0 sm:w-48 sm:max-w-none">
                        <button type="button" (click)="setTab('Anagrafica')" [class.bg-white]="activeTab() === 'Anagrafica'"
                            class="w-full rounded-lg px-4 py-3 text-left text-sm transition duration-150 cursor-pointer">
                            Anagrafica
                        </button>
                        <button type="button" (click)="setTab('Credenziali')" [class.bg-white]="activeTab() === 'Credenziali'"
                            class="w-full rounded-lg px-4 py-3 text-left text-sm transition duration-150 cursor-pointer">
                            Credenziali
                        </button>
                        <button type="button" (click)="setTab('Le tue auto')" [class.bg-white]="activeTab() === 'Le tue auto'"
                            class="w-full rounded-lg px-4 py-3 text-left text-sm transition duration-150 cursor-pointer">
                            Le tue auto
                        </button>
                    </nav>
                </div>

                <div class="min-w-0">
                    @switch (activeTab()) {
                    @case ('Anagrafica') {
                    <app-user-info-tab />
                    }
                    @case ('Credenziali') {
                    <app-user-credential-tab />
                    }
                    @case ('Le tue auto') {
                    <app-user-vehicle-tab />
                    }
                    }
                </div>
            </main>
        </div>
    </section>
</div>
