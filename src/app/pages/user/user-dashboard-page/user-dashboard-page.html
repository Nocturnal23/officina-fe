<div class="flex flex-col h-screen">

    <header class="bg-blue-200 flex justify-between items-center px-6">
        <p class="font-semibold text-slate-800">
            Benvenuto, {{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}!
        </p>

        <div class="relative">
            <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-haspopup="menu"
                class="cursor-pointer">
                Menu
            </button>

            @if (isMenuOpen()) {
            <div role="menu" class="absolute right-0 mt-2 rounded bg-white p-2 shadow flex flex-col gap-1 z-10">
                <button type="button" (click)="openProfile()"
                    class="text-center px-3 py-1 hover:bg-slate-200 rounded">Profilo</button>
                <button type="button" (click)="openHistory()"
                    class="text-center px-3 py-1 hover:bg-slate-200 rounded">Storico Prenotazioni</button>
                <button type="button" (click)="openInterventionHistory()"
                    class="text-center px-3 py-1 hover:bg-slate-200 rounded">Storico Interventi</button>
                <button type="button" (click)="logout()"
                    class="text-center px-3 py-1 hover:bg-red-600 hover:text-white text-red-600 rounded">Disconnetti</button>
            </div>
            }
        </div>

        @if (isProfileOpen()) {
        <app-profile-menu (close)="closeProfile()" />
        }
    </header>


    <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex flex-col gap-4 w-full max-w-4xl mx-auto">
            @for (b of dataList(); track b.id) {
                <app-booking-card-view 
                    [booking]="b" 
                    [isAdmin]="false" 
                    (delete)="deleteBooking($event)"
                />
            } @empty {
            <div class="text-center p-8 bg-white rounded-xl border border-slate-200 text-slate-500">
                Non hai nessun intervento in corso.
            </div>
            }
        </div>
        <div class="text-center mt-6">
            <button type="button" (click)="openBookingCard()"
                class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition shadow-sm cursor-pointer">
                Prenota ora un intervento
            </button>
        </div>

        @if (showBookingCard()) {
            <app-booking-card (close)="closeBookingCard()" (created)="onBookingCreated()" />
        }

            @if (totalPages() > 1) {
                <div class="w-full max-w-4xl mx-auto">
                    <app-paginator
                        [currentPage]="currentPage()" 
                        [totalPages]="totalPages()" 
                        [isLastPage]="isLastPage()"
                        (next)="nextPage()"
                        (prev)="prevPage()"
                    >
                    </app-paginator>     
                </div>
            }
    </main>
</div>
