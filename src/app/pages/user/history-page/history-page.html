<div class="flex flex-col">
    <header class="bg-blue-200 flex justify-between items-center py-6 px-8">
        <div class="flex items-center gap-4">
            <div class="flex items-start gap-4">
                <button class="text-slate-600 hover:text-slate-900 mt-1 cursor-pointer" (click)="goBackDashboard()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
            </div>

            <div class="flex flex-col">
                <h2 class="text-xl font-bold text-slate-900 leading-tight">Storico prenotazioni</h2>
                <p class="text-sm text-slate-500 mt-1">Visualizza tutte le prenotazioni accettate o rifiutate
                </p>
            </div>
        </div>
    </header>


    <main class="flex-1 p-6 bg-slate-50 overflow-y-auto">
        <div class="flex flex-col gap-4 max-w-4xl mx-auto">
            <app-list-filters
                [filters]="currentListFilters()"
                [vehicleOptions]="vehicles()"
                [jobOptions]="jobs()"
                (filtersChange)="filterState.applyFilters($event)"
                (vehicleSearch)="filterState.searchVehicles($event)"
            />

            <div class="flex gap-2 mb-4 bg-white p-2 rounded-xl border border-slate-200">
                <button (click)="setFilter('ALL')"
                    [ngClass]="currentFilters().length === 2 ? 'bg-blue-100 text-blue-700' : 'bg-slate-50 text-slate-600'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Tutti
                </button>
                <button (click)="setFilter(BookingStatuBut.COMPLETED)"
                    [ngClass]="currentFilters().includes(BookingStatuBut.COMPLETED) && currentFilters().length === 1 ? 'bg-green-100 text-green-700' : 'bg-slate-50 text-slate-600'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Solo Completati
                </button>
                <button (click)="setFilter(BookingStatuBut.REFUSED)"
                    [ngClass]="currentFilters().includes(BookingStatuBut.REFUSED) && currentFilters().length === 1 ? 'bg-red-100 text-red-700' : 'bg-slate-50 text-slate-600'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Solo Rifiutati
                </button>
            </div>

            <div class="flex flex-col gap-4 w-full max-w-4xl mx-auto">
                @for (b of dataList(); track b.id) {
                    <app-booking-card-view [booking]="b" [isAdmin]="false" />
                } @empty {
                    <div class="text-center p-8 bg-white rounded-xl border border-slate-200 text-slate-500">
                        Nessun intervento presente nello storico.
                    </div>
                }
            </div>

            @if (totalPages() > 1) {
                <div class="w-full max-w-4xl mx-auto">
                    <app-paginator
                        [currentPage]="currentPage()" 
                        [totalPages]="totalPages()" 
                        [isLastPage]="isLastPage()"
                        (next)="nextPage()"
                        (prev)="prevPage()"
                    >
                    </app-paginator>     
                </div>
            }

        </div>
    </main>
</div>
