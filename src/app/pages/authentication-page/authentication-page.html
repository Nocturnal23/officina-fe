<!-- Contenitore di tutti gli elementi a schermo. -->
<div class="min-h-screen flex items-center justify-center">
    <!-- Contenitore del form -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <!-- Intestazione dinamica -->
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">
                {{ isLogin() ? 'Bentornato' : 'Crea un Account' }}
            </h2>
            <p class="text-sm text-slate-500 mt-1">
                {{ isLogin() ? 'Inserisci le tue credenziali per accedere' : 'Compila i dati per registrarti nel portale' }}
            </p>
        </div>

        <!-- Alert Messaggi (Errore / Successo) -->
        @if (errorMessage()) {
        <div
            class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
        </div>
        } @else if (successMessage()) {
        <div
            class="mb-5 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-medium flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>{{ successMessage() }}</span>
        </div>
        }

        <!-- FORM LOGIN -->
        @if (isLogin()) {
        <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()" class="space-y-4">

            <div>
                <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input id="login-email" type="email" formControlName="email" placeholder="nome@esempio.it"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800 placeholder-slate-400" />
            </div>

            <div>
                <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <div class="relative flex items-center">
                    <input 
                        id="login-password" 
                        [type]="showPassword() ? 'text' : 'password'"
                        formControlName="password" 
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800 placeholder-slate-400" 
                    />
                    <button 
                        type="button" 
                        (click)="togglePasswordVisibility()"
                        class="absolute right-3 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer flex items-center justify-center p-1"
                        aria-label="Mostra o nascondi password"
                    >
                        @if (showPassword()) {
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        } @else {
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        }
                    </button>
                </div>
            </div>

            <button type="submit" [disabled]="loginForm.invalid"
                class="w-full mt-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition duration-150 cursor-pointer">
                Accedi
            </button>
        </form>
        } @else {
        <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="register-firstName" class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
                    <input id="register-firstName" type="text" formControlName="firstName" placeholder="Mario"
                        class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800" />
                </div>
                <div>
                    <label for="register-lastName" class="block text-sm font-medium text-slate-700 mb-1">Cognome</label>
                    <input id="register-lastName" type="text" formControlName="lastName" placeholder="Rossi"
                        class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800" />
                </div>
            </div>

            <div>
                <label for="register-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input id="register-email" type="email" formControlName="email" placeholder="mario.rossi@esempio.it"
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800" />
            </div>

            <div>
                <label for="register-phone" class="block text-sm font-medium text-slate-700 mb-1">Telefono</label>
                <input id="register-phone" type="tel" formControlName="phoneNumber" placeholder="3331234567"
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800" />
            </div>

            <div>
                <label for="register-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <div class="relative flex items-center">
                    <input 
                        id="register-password" 
                        [type]="showPassword() ? 'text' : 'password'"
                        formControlName="password"
                        placeholder="Minimo 8 caratteri"
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-slate-800" 
                    />
                    <button 
                        type="button" 
                        (click)="togglePasswordVisibility()"
                        class="absolute right-3 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer flex items-center justify-center p-1"
                        aria-label="Mostra o nascondi password"
                    >
                        @if (showPassword()) {
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        } @else {
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        }
                    </button>
                </div>
                
            </div>

            <button type="submit" [disabled]="registerForm.invalid"
                class="w-full mt-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition duration-150 cursor-pointer">
                Crea Account
            </button>
        </form>
        }

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <button type="button" (click)="toggleMode()"
                class="text-sm font-semibold text-blue-600 hover:text-blue-800 hover:underline transition cursor-pointer">
                {{ isLogin() ? 'Non hai ancora un account? Registrati' : 'Hai già un account? Accedi' }}
            </button>
        </div>
    </div>
</div>
