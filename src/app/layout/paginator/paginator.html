<div class="flex justify-between items-center mt-6 bg-white p-4 rounded-xl border border-slate-200">
    <button (click)="onPrev()" [disabled]="currentPage() === 0"
        class="px-4 py-2 text-sm font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
        Precedente
    </button>
    
    <span class="text-sm font-medium text-slate-500">
        Pagina {{ currentPage() + 1 }} di {{ totalPages() }}
    </span>

    <button (click)="onNext()" [disabled]="isLastPage()"
        class="px-4 py-2 text-sm font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
        Successiva
    </button>
</div>
