<div class="space-y-6">

    <div>
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Credenziali di Accesso</h3>

        <div class="space-y-3">
            <!-- Riga Email -->
            <div class="flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Email di accesso</p>
                    <p class="text-sm font-semibold text-slate-800">{{ authService.currentUser()?.email }}</p>
                </div>
                <button type="button" class="text-xs font-semibold text-blue-600 hover:underline cursor-pointer">
                    Modifica
                </button>
            </div>

            <!-- Riga Password -->
            <div class="flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Password</p>
                    <p class="text-sm font-semibold text-slate-800 tracking-widest">••••••••••••</p>
                </div>
                <button type="button" (click)="togglePasswordForm()"
                    class="text-xs font-semibold text-blue-600 hover:underline cursor-pointer">
                    {{ isChangingPassword() ? 'Annulla' : 'Cambia Password' }}
                </button>
            </div>
        </div>
    </div>

    <!-- Form di Cambio Password (compare al click) -->
    @if (isChangingPassword()) {
    <div class="p-4 rounded-xl border border-blue-100 bg-blue-50/50 space-y-3">
        <h4 class="text-xs font-bold text-slate-700 uppercase">Imposta nuova password</h4>

        <div class="space-y-2">
            <input type="password" placeholder="Vecchia password"
                class="w-full text-sm p-2 bg-white border border-slate-200 rounded-lg focus:outline-blue-600" />
            <input type="password" placeholder="Nuova password"
                class="w-full text-sm p-2 bg-white border border-slate-200 rounded-lg focus:outline-blue-600" />
            <input type="password" placeholder="Conferma nuova password"
                class="w-full text-sm p-2 bg-white border border-slate-200 rounded-lg focus:outline-blue-600" />
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <button type="button" (click)="togglePasswordForm()"
                class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-200 rounded-lg transition">
                Annulla
            </button>
            <button type="button"
                class="px-3 py-1.5 text-xs bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
                Aggiorna Password
            </button>
        </div>
    </div>
    }

    <!-- Zona Pericolo: Eliminazione Profilo (Nascosta se ADMIN) -->
    @if (!isAdmin) {
    <div class="pt-4 border-t border-slate-200">
        <div class="flex items-center justify-between p-3.5 rounded-xl border border-red-200 bg-red-50/40">
            <div>
                <p class="text-xs font-bold text-red-600 uppercase">Zona Pericolo</p>
                <p class="text-xs text-slate-500">Elimina l'account e tutti i veicoli associati.</p>
            </div>
            <button type="button" (click)="onDeleteAccount()"
                class="px-3 py-1.5 text-xs font-semibold text-red-600 border border-red-300 rounded-lg hover:bg-red-600 hover:text-white transition cursor-pointer">
                Elimina Profilo
            </button>
        </div>
    </div>
    }

</div>
