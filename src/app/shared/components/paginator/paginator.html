<div class="flex items-center justify-between border border-slate-200 bg-white" [ngClass]="compact()
          ? 'mt-2 rounded-lg px-2 py-1'
          : 'mt-6 rounded-xl p-4'">
    <button (click)="onPrev()" [disabled]="currentPage() === 0" [ngClass]="compact()
      ? 'px-2 py-1 text-xs'
      : 'px-4 py-2 text-sm'"
        class="font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
        Precedente
    </button>

    <span class="font-medium text-slate-500" [ngClass]="compact() ? 'text-xs' : 'text-sm'">
        Pagina {{ currentPage() + 1 }} di {{ totalPages() }}
    </span>

    <button (click)="onNext()" [disabled]="isLastPage()" [ngClass]="compact()
      ? 'px-2 py-1 text-xs'
      : 'px-4 py-2 text-sm'"
        class="font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
        Successiva
    </button>
</div>
