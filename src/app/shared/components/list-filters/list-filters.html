<section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="mb-4 flex items-center justify-between gap-3">
    <div>
      <h2 class="text-sm font-semibold text-slate-800">Filtri</h2>
      <p class="text-xs text-slate-500">Restringi i risultati della lista</p>
    </div>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="applyFilters()"
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
  >
    <div class="flex flex-col gap-3 sm:col-span-2 lg:col-span-1">
      <label for="dateMode" class="text-sm font-semibold text-slate-700">Data</label>
      <select
        id="dateMode"
        formControlName="mode"
        (change)="dateRangeError.set(false)"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
      >
        <option value="range">Intervallo</option>
        <option value="on">In questa data</option>
        <option value="before">Prima di</option>
        <option value="after">Dopo</option>
      </select>

      @if (form.controls.mode.value === 'range') {
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div class="flex flex-col gap-1">
            <label for="dateFrom" class="text-xs font-medium text-slate-600">Dal</label>
            <input
              id="dateFrom"
              type="date"
              formControlName="from"
              required
              (input)="dateRangeError.set(false)"
              class="w-full min-w-0 rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label for="dateTo" class="text-xs font-medium text-slate-600">Al</label>
            <input
              id="dateTo"
              type="date"
              formControlName="to"
              required
              (input)="dateRangeError.set(false)"
              class="w-full min-w-0 rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
            />
          </div>
        </div>
        @if (dateRangeError()) {
          <p class="text-xs text-red-600" role="alert">
            La data iniziale deve essere precedente o uguale a quella finale.
          </p>
        }
      } @else {
        <div class="flex flex-col gap-1">
          <label for="filterDate" class="text-xs font-medium text-slate-600">Giorno</label>
          <input
            id="filterDate"
            type="date"
            formControlName="date"
            required
            class="w-full min-w-0 rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
          />
        </div>
      }
    </div>

    <div class="col-span-full mt-1 flex flex-wrap justify-end gap-2 border-t border-slate-100 pt-4">
      <button
        type="button"
        (click)="clearFilters()"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-600/30"
      >
        Azzera
      </button>
      <button
        type="submit"
        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600/40"
      >
        Applica filtri
      </button>
    </div>
  </form>
</section>
